apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
        - name: db-init
          image: postgres:14
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting database initialization..."

              # Function to check if postgres is ready
              wait_for_postgres() {
                local max_attempts=30
                local attempt=1
                while [ $attempt -le $max_attempts ]; do
                  if pg_isready -h postgres -p 5432; then
                    echo "PostgreSQL is ready!"
                    return 0
                  fi
                  echo "Attempt $attempt/$max_attempts: Waiting for postgres..."
                  sleep 2
                  attempt=$((attempt + 1))
                done
                echo "Failed to connect to PostgreSQL after $max_attempts attempts"
                return 1
              }

              # Function to initialize database
              init_database() {
                echo "Initializing database..."
                if PGPASSWORD=postgres psql -h postgres -U postgres -d sampleapp -f /init.sql; then
                  echo "Database initialization completed successfully"
                  return 0
                else
                  echo "Database initialization failed"
                  return 1
                fi
              }

              # Main execution
              if wait_for_postgres; then
                if init_database; then
                  echo "Database setup completed successfully"
                  exit 0
                else
                  echo "Database initialization failed"
                  exit 1
                fi
              else
                echo "Failed to connect to PostgreSQL"
                exit 1
              fi
          volumeMounts:
            - name: init-script
              mountPath: /init.sql
              subPath: init.sql
      volumes:
        - name: init-script
          configMap:
            name: db-init-script
      restartPolicy: OnFailure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    -- Create tasks table
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert sample data
    INSERT INTO tasks (title, description) VALUES
        ('Welcome to Task Manager', 'This is a sample task to get you started. Feel free to add more tasks!'),
        ('Learn GitOps', 'Study GitOps principles and practices for better deployment workflows'),
        ('Setup Development Environment', 'Configure your local development environment with DevSpace')
    ON CONFLICT DO NOTHING;
