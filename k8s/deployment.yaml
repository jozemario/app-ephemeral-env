apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      initContainers:
        - name: init-db
          image: postgres:14
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done;",
            ]
      containers:
        - name: sample-app
          image: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app:${PR_NUMBER}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  tls:
    - secretName: sample-app-tls
      hosts:
        - sample-app-$(PR_NUMBER).mghcloud.com
  rules:
    - host: sample-app-$(PR_NUMBER).mghcloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 80
