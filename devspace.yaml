version: v2beta1
name: sample-app-dev

vars:
  PR_NUMBER:
    source: env
  REGISTRY:
    source: env
    default: ghcr.io
  REGISTRY_NAMESPACE:
    source: env

deployments:
  sample-app:
    kubectl:
      manifests:
        - k8s/
      kustomize: true
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: sample-app
          op: replace
          path: spec.template.spec.containers[0].image
          value: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app:${PR_NUMBER}
        - target:
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            name: sample-app
          op: replace
          path: spec.rules[0].host
          value: sample-app-${PR_NUMBER}.mghcloud.com
        - target:
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            name: sample-app
          op: replace
          path: spec.tls[0].hosts[0]
          value: sample-app-${PR_NUMBER}.mghcloud.com

dev:
  sample-app:
    imageSelector: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app:${PR_NUMBER}
    ports:
      - port: "8080:8080"
      - port: "9229:9229"
    sync:
      - path: "./src:/app"
        excludePaths:
          - node_modules
          - .git
    terminal:
      command: "npm run dev"

images:
  sample-app:
    context: ./
    dockerfile: ./Dockerfile
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app
    tags:
      - ${PR_NUMBER}
