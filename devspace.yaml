version: v2beta1
name: sample-app-dev

vars:
  PR_NUMBER:
    source: env
  REGISTRY:
    source: env
    default: ghcr.io
  REGISTRY_NAMESPACE:
    source: env

deployments:
  sample-app:
    kubectl:
      manifests:
        - k8s/deployment.yaml
        - k8s/postgres.yaml
        - k8s/configmap.yaml
        - k8s/db-init.yaml
      kustomize:
        path: ./k8s
      patches:
        - op: replace
          path: /spec/template/spec/containers/0/image
          value: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app:${PR_NUMBER}

dev:
  ports:
    - port: "8080:8080"
    - port: "9229:9229"
  sync:
    - localSubPath: ./src
      containerPath: /app/src
      excludePaths:
        - node_modules
        - .git
  terminal:
    command: ["npm", "run", "dev"]
  env:
    NODE_ENV: development
    DEBUG: express:*

images:
  sample-app:
    buildArgs:
      NODE_ENV: development
    context: ./
    dockerfile: ./Dockerfile
    image: ${REGISTRY}/${REGISTRY_NAMESPACE}/sample-app
    tags:
      - ${PR_NUMBER}
